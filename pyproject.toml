[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-provider-anyrouter"
version = "0.1.0"
description = "AnyRouter model-provider plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "duyet" }]
keywords = [
    "hermes-agent",
    "hermes-plugin",
    "model-provider",
    "anyrouter",
    "llm",
    "openai-compatible",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/duyet/hermes-provider-anyrouter"
Issues = "https://github.com/duyet/hermes-provider-anyrouter/issues"
AnyRouter = "https://anyrouter.dev"

# Hermes discovers pip-installed providers through this group. A bare module
# target self-registers on import; the loader skips callables that need
# arguments, so no register() shim is needed here.
[project.entry-points."hermes_agent.plugins"]
anyrouter = "anyrouter"

[tool.setuptools]
packages = ["anyrouter"]

[tool.setuptools.package-data]
anyrouter = ["plugin.yaml", "after-install.md"]
